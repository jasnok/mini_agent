name: Mini Agent 01 CI CD

on:
  push:
    branches:
      - main
    paths:
      - "mini_agent_01_llm/**"
      - ".github/workflows/mini-agent-01-cicd.yml"
  pull_request:
    paths:
      - "mini_agent_01_llm/**"
      - ".github/workflows/mini-agent-01-cicd.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy Mini Agent 01 to wk01"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mini-agent-01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini_agent_01_llm
    env:
      PYTHONPATH: backend
      LLM_PROVIDER: mock
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Prepare CI environment file
        run: cp .env.example .env

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: wk01
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$AWS_HOST" || { echo "::error::AWS_HOST is missing"; exit 1; }
          test -n "$AWS_USER" || { echo "::error::AWS_USER is missing"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::AWS_SSH_PRIVATE_KEY is missing"; exit 1; }
          test -n "$AWS_SSH_KNOWN_HOSTS" || { echo "::error::AWS_SSH_KNOWN_HOSTS is missing"; exit 1; }

      - name: Configure verified SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy application source
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$AWS_USER@$AWS_HOST" 'mkdir -p ~/mini-agent-01-llm'
          scp -o StrictHostKeyChecking=yes -r mini_agent_01_llm/. "$AWS_USER@$AWS_HOST:~/mini-agent-01-llm/"

      - name: Deploy and verify application
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$AWS_USER@$AWS_HOST" 'cd ~/mini-agent-01-llm && test -f .env && docker compose config --quiet && docker compose up -d --build --force-recreate --remove-orphans && curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:8000/health && curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:8501/_stcore/health'
