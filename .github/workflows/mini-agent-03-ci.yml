name: Mini Agent 03 CI

on:
  push:
    paths:
      - "mini_agent_03_tool/**"
      - ".github/workflows/mini-agent-03-ci.yml"
  pull_request:
    paths:
      - "mini_agent_03_tool/**"
      - ".github/workflows/mini-agent-03-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini_agent_03_tool
    env:
      PYTHONPATH: backend
      LLM_PROVIDER: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest backend/tests -q
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
